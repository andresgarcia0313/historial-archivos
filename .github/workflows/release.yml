name: Release

# Una etiqueta v* publica la Release; una ejecución manual solo construye y prueba los paquetes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Token de solo lectura por defecto; solo el trabajo de publicación puede escribir.
permissions:
  contents: read

jobs:
  deb:
    name: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión del código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' historial/__init__.py)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "Etiqueta $GITHUB_REF_NAME y versión $v no coinciden"; exit 1; }
      - id: paquete
        run: echo "deb=$(scripts/empaquetar-deb.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: ${{ steps.paquete.outputs.deb }}

  deb-test:
    name: probar ${{ matrix.imagen }}
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        imagen: ["ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.imagen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - run: HISTORIAL_EN_CONTENEDOR=1 scripts/probar-deb.sh dist/*.deb

  macos:
    name: macOS ${{ matrix.arquitectura }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arquitectura: arm64 }
          - { os: macos-15-intel, arquitectura: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Pruebas unitarias
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - id: paquete
        run: dmg="$(scripts/empaquetar-dmg.sh)"; dmg="${dmg##*$'\n'}"; echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
      - name: Prueba de humo del dmg (sin pantalla)
        run: scripts/probar-dmg.sh "${{ steps.paquete.outputs.dmg }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arquitectura }}
          path: ${{ steps.paquete.outputs.dmg }}

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-test, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
